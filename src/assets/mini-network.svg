<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="160" viewBox="0 0 360 160" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="gA" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#14e6ff" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#4ca9ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#9c4dff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="lineGrad" x1="0%" x2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <!-- faint background glow ellipse -->
  <ellipse cx="180" cy="80" rx="140" ry="60" fill="url(#gA)" opacity="0.12"/>

  <!-- static connector lines -->
  <line x1="40" y1="120" x2="170" y2="45" stroke="url(#lineGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170" y1="45" x2="300" y2="95" stroke="url(#lineGrad)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="60" x2="170" y2="45" stroke="url(#lineGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- animated nodes -->
  <g>
    <!-- left node -->
    <circle cx="40" cy="120" r="6" fill="#4ca9ff">
      <animate attributeName="r" values="6;10;6" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.5;1" dur="5s" repeatCount="indefinite" />
    </circle>

    <!-- top node -->
    <circle cx="170" cy="45" r="6.5" fill="#9c4dff">
      <animate attributeName="r" values="6.5;12;6.5" dur="6.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.6;1" dur="6.2s" repeatCount="indefinite" />
    </circle>

    <!-- right node -->
    <circle cx="300" cy="95" r="5.5" fill="#14e6ff">
      <animate attributeName="r" values="5.5;9;5.5" dur="4.6s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="1;0.45;1" dur="4.6s" repeatCount="indefinite" />
    </circle>

    <!-- tiny drifting dot 1 -->
    <circle cx="95" cy="82" r="3" fill="#4ca9ff" opacity="0.14">
      <animate attributeName="cy" values="82;70;82" dur="7.3s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="95;110;95" dur="8.6s" repeatCount="indefinite"/>
    </circle>

    <!-- tiny drifting dot 2 -->
    <circle cx="230" cy="60" r="3.2" fill="#9c4dff" opacity="0.14">
      <animate attributeName="cy" values="60;50;60" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="230;220;230" dur="7.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- subtle pulsing center glow -->
  <circle cx="170" cy="45" r="22" fill="#14e6ff" opacity="0.03">
    <animate attributeName="r" values="20;26;20" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.03;0.08;0.03" dur="8s" repeatCount="indefinite"/>
  </circle>
</svg>
